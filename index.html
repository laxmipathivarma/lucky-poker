<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NamMane">
<meta name="description" content="NamMane: home event manager for buy-ins, tables, settle up and invites.">
<link rel="manifest" href="manifest.webmanifest">

<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NamMane</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Las Vegas design system: deep emerald felt, ivory panels, ribbon-red actions, neon gold accents, black-chip toggles */
:root{
  --felt:#0d4e30; --felt-deep:#04190f;
  --bg:#f3ecda; --surface:#fbf7ec; --sunk:#efe7d3; --ink:#1c1813; --muted:#6a5e47; --line:#e2d6b8;
  --gold:#d4a73a; --gold-hi:#f6d67a; --gold-line:rgb(212 167 58 / .55);
  --accent:#b8281d; --accent-hi:#d8412f; --accent-lo:#8f1a13; --accent-ink:#fff8ea;
  --chip:#b8281d; --up:#17703f; --down:#b3261e; --warn:#7f5600; --warn-bg:#fff0cc; --ok-bg:#e2f0e3;
  --black:#1b1f1d; --cream:#f4efe2;
  --neon-gold:rgba(244,207,106,.35); --neon-red:rgba(232,80,63,.25);
  --f-display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --hi:rgb(255 255 255 / .75);
  --lift:0 2px 3px rgb(0 0 0 / .18),0 14px 30px rgb(0 0 0 / .32);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a13; --surface:#12261c; --sunk:#0e1f17; --ink:#efe7d2; --muted:#a8b6a6; --line:#2b4537;
  --chip:#ef6b5b; --up:#5fd197; --down:#ff8a7a; --warn:#f0c255; --warn-bg:#33280c; --ok-bg:#163a27;
  --hi:rgb(255 255 255 / .06); --lift:0 2px 3px rgb(0 0 0 / .3),0 14px 30px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a13; --surface:#12261c; --sunk:#0e1f17; --ink:#efe7d2; --muted:#a8b6a6; --line:#2b4537;
  --chip:#ef6b5b; --up:#5fd197; --down:#ff8a7a; --warn:#f0c255; --warn-bg:#33280c; --ok-bg:#163a27;
  --hi:rgb(255 255 255 / .06); --lift:0 2px 3px rgb(0 0 0 / .3),0 14px 30px rgb(0 0 0 / .5); color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--felt-deep)}
body{min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse 140% 55% at 50% 0%,#176b45 0%,var(--felt) 32%,#082a1c 72%,var(--felt-deep) 100%);background-color:var(--felt-deep)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0a3324}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,#0a3525 0%,#051d12 100%);color:var(--cream);border-bottom:2px solid var(--gold);box-shadow:0 0 24px var(--neon-gold),0 6px 18px rgb(0 0 0 / .45)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px 0}
.titleRow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:4px;flex-shrink:0}
.brand .mark{width:76px;height:54px;filter:drop-shadow(0 4px 5px rgb(0 0 0 / .35))}
.brand .ribbon{width:176px;height:auto;filter:drop-shadow(0 3px 4px rgb(0 0 0 / .4))}
.titleRow .sep{width:1px;align-self:stretch;background:var(--gold-line);opacity:.6}
.gameName{color:var(--cream);font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;color:#c9d6cc;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status b{width:8px;height:8px;border-radius:50%;background:#8fa79a}
.status[data-s="cloud"] b{background:#4cc58b} .status[data-s="saving"] b{background:var(--gold-hi)} .status[data-s="unsaved"] b{background:#ff7b6b}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 12px;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.03em;color:#b9cbbf;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold-hi);text-shadow:0 0 12px var(--neon-gold)}
nav.tabs button .ct{font-family:var(--f-num);font-size:12px;font-weight:600;letter-spacing:0;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:2px}

/* start screen */
.hero{display:flex;align-items:center;justify-content:center;gap:8px 32px;flex-wrap:wrap;border-radius:18px;padding:24px 20px;border:2px solid var(--gold);background:radial-gradient(circle at 32% 45%,rgb(244 207 106 / .06),transparent 62%),radial-gradient(circle at 80% 70%,rgb(232 80 63 / .04),transparent 55%);color:var(--cream);box-shadow:0 0 30px rgba(212,167,58,.12),var(--lift)}
.hero .fanart{width:min(360px,100%);height:auto}
.hero .wm{max-width:34ch;display:flex;flex-direction:column;gap:10px}
.hero .wm span{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi)}
.hero .wm p{margin:0;font-size:16px;color:#e8e0c8}
.emptyart{width:120px;height:auto;flex-shrink:0}
.emptyRow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}

/* playing-card surfaces: ivory, gold inner border, lifted off the felt */
.strip,.panel,.pcard{background:var(--surface);border:1px solid var(--gold-line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--gold-line),var(--lift),0 0 20px rgba(212,167,58,.08)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));overflow:hidden;padding:6px}
.strip div{padding:10px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip div:last-child{border-right:0}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strip .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
.strip .v small{font-size:12px;color:var(--muted);font-weight:500}

.panel{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:.03em;text-wrap:balance;display:flex;align-items:center;gap:10px}
.panel h2::before{content:"";width:9px;height:9px;flex-shrink:0;background:var(--accent);transform:rotate(45deg);border-radius:1px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--gold-line)}
.panel p.hint{margin:0;color:var(--muted);font-size:13.5px;max-width:65ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:150px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=url],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;box-shadow:inset 0 2px 3px rgb(0 0 0 / .07)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.amt{max-width:140px}

/* buttons: ivory card, ribbon-red primary, black chip for quick buy-ins */
.btn{border:1px solid var(--line);background:linear-gradient(var(--surface),var(--sunk));color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--line),0 3px 8px rgb(0 0 0 / .08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 0 0 var(--line)}
.btn.pri{background:linear-gradient(var(--accent-hi),var(--accent) 55%,var(--accent-lo));border-color:var(--accent-lo);color:var(--accent-ink);text-shadow:0 1px 0 rgb(0 0 0 / .25);box-shadow:inset 0 1px 0 rgb(255 255 255 / .35),inset 0 -1px 0 rgb(0 0 0 / .2),0 2px 0 #5e0e09,0 4px 10px rgb(0 0 0 / .22),0 0 16px var(--neon-red)}
.btn.pri:active{box-shadow:inset 0 1px 0 rgb(255 255 255 / .25),0 0 0 #5e0e09}
.btn.chipb{background:radial-gradient(circle at 50% 28%,#3d4441,var(--black) 70%);color:var(--gold-hi);border:3px dashed rgb(244 239 226 / .85);border-radius:999px;padding-inline:18px;box-shadow:0 0 0 1px var(--black),0 3px 0 #000,0 5px 12px rgb(0 0 0 / .28)}
.btn.chipb:active{box-shadow:0 0 0 1px var(--black),0 0 0 #000}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--down)}
.btn[disabled]{opacity:.55;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.conn summary{cursor:pointer;font-weight:600;color:var(--muted);padding-block:6px}
.conn{border-top:1px solid var(--line);padding-top:8px}
.sheetline{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:inset 0 2px 3px rgb(0 0 0 / .07)}
.seg button{border:0;background:none;padding:9px 13px;min-height:42px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:radial-gradient(circle at 50% 28%,#3d4441,var(--black) 75%);color:var(--gold-hi);box-shadow:inset 0 0 0 2px rgb(244 239 226 / .18)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);min-height:44px}
label.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* player cards */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard.done{background:var(--sunk);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 5px var(--sunk),inset 0 0 0 6px var(--line),var(--lift)}
.pcard .head{display:flex;gap:10px;align-items:center}
.pcard .pname{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.01em;border:0;background:transparent;box-shadow:none;padding:2px 0;min-height:40px;flex:1;min-width:0}
.pcard .pname:focus{background:var(--bg);padding-inline:8px;border-radius:6px}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:20px;padding:4px 10px;white-space:nowrap}
.tag.live{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.tag.out{background:var(--line);color:var(--muted)}
.figs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-block:4px;border-block:1px dashed var(--line)}
.figs div{display:flex;flex-direction:column;gap:1px}
.figs .n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .mut{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 11px;font-size:13px;background:var(--bg)}
.pill .num{font-weight:600}
.pill.credit{border-style:dashed;border-color:var(--chip);color:var(--chip)}
.pill button{border:0;background:none;width:28px;height:28px;border-radius:50%;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.inline{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}

table.t{width:100%;border-collapse:collapse;font-size:14px}
.tscroll{overflow-x:auto}
.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.t td.r,.t th.r{text-align:right}
.t tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:600;border-top:2px solid var(--line)}
.callout{border-radius:12px;padding:12px 14px;font-size:14px;display:block;color:var(--ink);box-shadow:var(--lift)}
.callout.ok{background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--up) 35%,transparent)}
.callout.warn{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.panel .callout{box-shadow:none}
.callout b.k{font-family:var(--f-num)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .sub{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.pay{font-weight:600}
.big{font-family:var(--f-display);font-size:38px;font-weight:800;line-height:1}
pre.share{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;margin:0;max-height:320px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--black);color:var(--cream);border:1px solid var(--gold-line);border-radius:12px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;z-index:20;box-shadow:0 8px 26px rgb(0 0 0 / .4);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--gold-hi);font-weight:700;padding:8px 10px;cursor:pointer}
.ex{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#7f5600;background:#fff0cc;border-radius:20px;padding:3px 9px}
textarea{resize:vertical;font:inherit;color:inherit}
.icard{border:1px solid var(--gold-line);box-shadow:var(--lift);border-radius:var(--r);background:radial-gradient(circle at 30% 30%,#1d6b49 0%,#062016 80%);color:#f4efe2;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding-block:16px;padding-inline:16px}
.icard .fanart{width:min(170px,40%);height:auto;flex-shrink:0}
.icard .ibody{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.icard .ikick{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#f2c14e}
.icard .iname{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-wrap:balance}
.icard .iline{font-size:14px;color:#e8e1cd}
.icard .iline span{display:inline-block;min-width:64px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#a9bdb1}
.icard .ilink{background:transparent;border-color:rgb(242 193 78 / .6);color:#f6d684;min-height:40px}
/* tables */
.tablebar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tbtn{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:48px;cursor:pointer;box-shadow:var(--lift)}
.tbtn b{font-family:var(--f-display);font-size:18px;letter-spacing:.03em}
.tbtn span{font-size:12px;color:var(--muted)}
.tbtn[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-line),var(--lift);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.tbtn.add{border-style:dashed;justify-content:center;font-weight:600;color:var(--accent);box-shadow:none;background:transparent}
.tname{font-family:var(--f-display);font-weight:800;font-size:24px;border:0!important;background:transparent!important;box-shadow:none!important;padding:2px 0!important;max-width:260px}
.tname:focus{background:var(--bg)!important;padding-inline:8px!important}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tstats div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px}
.tstats b{font-size:17px;font-variant-numeric:tabular-nums}
.dealerbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.closepanel{border-color:var(--accent)}
.closerow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:6px;border-bottom:1px solid var(--line)}
.closerow .cn{display:flex;flex-direction:column}
.closerow .cn .sub{font-size:12.5px;color:var(--muted)}
.closerow input{max-width:160px}
.li.dl{flex-wrap:wrap}
.dsum{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
details.gset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--gold-line),var(--lift)}
details.gset>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding-block:14px;padding-inline:18px;min-height:56px}
details.gset>summary::-webkit-details-marker{display:none}
details.gset>summary::before{content:"";width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex-shrink:0}
details.gset[open]>summary::before{transform:rotate(45deg)}
.gs-main{flex:1;min-width:0;display:flex;flex-direction:column}
.gs-main b{font-family:var(--f-display);font-size:21px;letter-spacing:.02em}
.gs-main .sub{font-size:13px;color:var(--muted)}
.gs-body{display:flex;flex-direction:column;gap:14px;padding-block:0 16px;padding-inline:12px}
.gs-body .panel{box-shadow:none}
.tag.st-done{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.tag.st-due,.tag.due{background:color-mix(in srgb,var(--chip) 14%,transparent);color:var(--chip)}
.tag.st-ready{background:var(--warn-bg);color:var(--warn)}
.tag.st-play,.tag.st-empty{background:var(--line);color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:10px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 1px 2px rgb(0 0 0 / .12)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--up),color-mix(in srgb,var(--up) 70%,#fff));border-radius:10px}
.xfer .amtx{font-size:18px}
.xfer.isdone .pay,.xfer.isdone .amtx{opacity:.55}
.xfer.isdone .amtx{text-decoration:line-through}
.btn.tgl[aria-pressed="true"]{background:color-mix(in srgb,var(--up) 16%,var(--surface));border-color:var(--up);color:var(--up)}
.big-btn{text-decoration:none;justify-content:center;text-align:center;font-size:18px;padding-inline:26px;min-height:52px;font-family:var(--f-display);letter-spacing:.06em}
@media (max-width:520px){.xfer{flex-wrap:wrap}.xfer .main{flex-basis:100%}}
@media (max-width:520px){.gameName{font-size:22px;flex-basis:100%;order:3}.titleRow .sep{display:none}.status{margin-left:auto}.figs .n{font-size:15px}.brand .mark{width:62px;height:44px}.brand .ribbon{width:146px}nav.tabs button{font-size:17px;padding-inline:11px}}

}

/* expanding sections */
.panel.acc>h2{cursor:pointer;user-select:none;-webkit-user-select:none;padding-right:34px;position:relative;min-height:32px}
.panel.acc>h2::after{content:"";position:absolute;right:6px;top:50%;width:10px;height:10px;margin-top:-7px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .18s}

.panel.acc.shut>*:not(h2){display:none!important}

.panel.acc>h2:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header class="top">
  <div class="wrap">

<script>
(function(){
const SPADE='M0 -30 C8 -18 26 -10 26 4 C26 14 16 19 8 15 C5 13 3 11 2 9 C3 17 6 22 10 26 H-10 C-6 22 -3 17 -2 9 C-3 11 -5 13 -8 15 C-16 19 -26 14 -26 4 C-26 -10 -8 -18 0 -30 Z';

<linearGradient id="${p}paper" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#ece2cb"/></linearGradient>${goldGrad(p+'gold')}

<path id="${p}spade" d="${SPADE}"/><path id="${p}heart" d="${HEART}"/>
<g id="${p}chip"><path d="M-70 0 V16 A70 26 0 0 0 70 16 V0 Z" fill="currentColor"/><path d="M-70 0 V16 A70 26 0 0 0 70 16 V0 Z" fill="#000" opacity=".3"/><path d="M-70 8 A70 26 0 0 0 70 8" fill="none" stroke="#f4efe2" stroke-width="13" stroke-dasharray="12 17"/><path d="M-70 0 V16 A70 26 0 0 0 70 16 V0 Z" fill="url(#${p}side)"/><ellipse rx="70" ry="26" fill="currentColor"/><ellipse rx="63" ry="23" fill="none" stroke="#f4efe2" stroke-width="8" stroke-dasharray="13 16"/><ellipse rx="44" ry="16" fill="none" stroke="#f4efe2" stroke-width="1.6" opacity=".85"/><ellipse rx="40" ry="14.5" fill="#000" opacity=".18"/><ellipse rx="70" ry="26" fill="url(#${p}top)"/></g></defs>`;
  const card=(x,rot,suit,col,shine)=>`<g transform="translate(${x} 46) rotate(${rot} 75 210)"><rect x="6" y="10" width="150" height="210" rx="14" fill="#000" opacity=".45" filter="url(#${p}blur)"/><rect width="150" height="210" rx="14" fill="url(#${p}paper)" stroke="#c9bd9c" stroke-width="1.2"/><rect x="8" y="8" width="134" height="194" rx="9" fill="none" stroke="#d2a73c" stroke-width="1.5" opacity=".7"/><text x="20" y="40" font-family="Georgia,serif" font-weight="700" font-size="28" fill="${col}">A</text><use href="#${p}${suit}" fill="${col}" transform="translate(29 62) scale(.4)"/><use href="#${p}${suit}" fill="#000" opacity=".25" transform="translate(78 117) scale(1.55)"/><use href="#${p}${suit}" fill="${col}" transform="translate(75 113) scale(1.55)"/>${shine}</g>`;
  let body=`<ellipse cx="225" cy="300" rx="170" ry="26" fill="#000" opacity=".5" filter="url(#${p}blur)"/>`
   +card(140,-15,'spade','#16211b','<path d="M60 84 C64 78 70 74 74 70" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".35"/>')

   +`<use href="#${p}chip" x="330" y="272" color="#25292b"/><use href="#${p}chip" x="334" y="256" color="#25292b"/><use href="#${p}chip" x="328" y="240" color="#c9372c"/><g transform="translate(328 240) scale(.95 .36)"><use href="#${p}spade" fill="#4a1a08" opacity=".7" transform="translate(0 5)"/><use href="#${p}spade" fill="url(#${p}gold)" stroke="#7a4a08" stroke-width="1.4"/></g><use href="#${p}chip" x="108" y="292" color="#16804f"/>`;

  const vb=full?'0 0 440 420':'30 50 380 272';
  const a=full?'role="img" aria-label="NamMane: ace of spades and ace of hearts fanned behind a stack of chips, with a red ribbon"':'aria-hidden="true"';
  return `<svg class="${cls}" viewBox="${vb}" ${a}>${defs}${body}</svg>`}
/* Ribbon wordmark used beside the logo in the header */
function ribbonWord(p){return `<svg class="ribbon" viewBox="0 0 300 80" role="img" aria-label="NamMane"><defs>${goldGrad(p+'gold')}<linearGradient id="${p}rib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5503f"/><stop offset=".5" stop-color="#c3322a"/><stop offset="1" stop-color="#8f1a13"/></linearGradient></defs>
<path d="M6 22 L40 17 L40 67 L6 72 L20 45 Z" fill="#7e140e"/><path d="M294 22 L260 17 L260 67 L294 72 L280 45 Z" fill="#7e140e"/><path d="M28 12 L40 17 L40 25 Z" fill="#4a0b07"/><path d="M272 12 L260 17 L260 25 Z" fill="#4a0b07"/>
<path d="M28 12 Q150 26 272 12 L272 60 Q150 74 28 60 Z" fill="url(#${p}rib)"/><path d="M28 17 Q150 31 272 17" fill="none" stroke="url(#${p}gold)" stroke-width="2"/><path d="M28 55 Q150 69 272 55" fill="none" stroke="url(#${p}gold)" stroke-width="2"/>
<g font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="24"><text x="38" y="50" textLength="224" lengthAdjust="spacingAndGlyphs" fill="#4a0b07">NAMMANE</text><text x="38" y="48" textLength="224" lengthAdjust="spacingAndGlyphs" fill="#fbeed2">NAMMANE</text></g></svg>`}
const LS='pokerledger.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tm=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
const dLabel=s=>{try{return new Date(s+'T12:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}};
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:NaN};
const r2=n=>Math.round(n*100)/100;

let S={games:{},cur:null,deleted:[],settings:{updatedAt:0}};
let tab='table', ui={buy:null,confirm:null,editOut:null,addInit:true,sheet:{busy:null,msg:'',err:false,where:''}};
let undoStack=[];

/* ---------- storage + Google Sheet sync ---------- */
let lsOk=true;
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&v.games){const st=S.settings;S=Object.assign({games:{},cur:null,deleted:[]},v);S.settings=Object.assign({},st,v.settings||{})}}catch(e){lsOk=false}}

const pending=new Set();let timer=null,syncing=false,retryT=null;
const syncCfg=()=>(S.settings.sync&&S.settings.sync.url&&S.settings.sync.key)?S.settings.sync:null;
function setStatus(s){const el=$('#status');el.dataset.s=s;$('#statusTxt').textContent=({cloud:'Saved to Google Sheet',saving:'Saving…',local:'Saved on this device',offline:'Offline · saved on this device',unsaved:'Not saved, storage blocked'})[s]}

async function api(body){const c=syncCfg();const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({key:c.key},body)),redirect:'follow'});let j;try{j=await r.json()}catch(e){throw{error:'bad_response'}}if(j.error)throw j;return j}
function mergeRemote(d){if(!d)return false;let changed=false;
  if(d.resetAt&&d.resetAt>(S.resetAt||0)){S.games={};S.deleted=[];S.cur=null;S.resetAt=d.resetAt;pending.clear();undoStack=[];changed=true}
  (d.deleted||[]).forEach(id=>{if(!S.deleted.includes(id))S.deleted.push(id);if(S.games[id]){delete S.games[id];changed=true}});
  Object.entries(d.games||{}).forEach(([id,g])=>{if(S.deleted.includes(id))return;const l=S.games[id];if(!l||(g.updatedAt||0)>(l.updatedAt||0)){S.games[id]=g;changed=true}});
  Object.values(S.games).forEach(g=>{if(g.sample)return;const rg=(d.games||{})[g.id];if(!rg||(g.updatedAt||0)>(rg.updatedAt||0))pending.add(g.id)});
  if(!S.cur||!S.games[S.cur])S.cur=latestId();return changed}
function syncErr(e){const c=e&&e.error;if(c==='bad_key')return 'The connection code was not accepted. Paste the code again in the Google Sheet section.';if(navigator.onLine===false)return 'You are offline. Everything is saved on this device and will sync when you are back online.';return 'Could not reach your Google Sheet. Everything is saved on this device; it will try again shortly.'}
async function syncNow(manual,where){if(!syncCfg())return false;if(syncing){clearTimeout(timer);timer=setTimeout(()=>syncNow(manual,where),1500);return false}
  syncing=true;clearTimeout(retryT);if(manual){ui.sheet={busy:'book',msg:'',err:false,where};render()}
  const ids=[...pending];pending.clear();let ok=false;
  try{const games={};ids.forEach(id=>{if(S.games[id])games[id]=S.games[id]});
    const j=await api({action:'save',games,deleted:S.deleted,sheets:sheetPayload()});
    const changed=mergeRemote(j.data);ui.profiles=j.profiles||ui.profiles;ui.rsvp=j.rsvp||ui.rsvp;S.settings.bookUrl=j.sheetUrl;S.settings.bookAt=Date.now();lsSave();setStatus('cloud');ok=true;
    if(manual)ui.sheet={busy:null,msg:'Google Sheet updated with all games.',err:false,where};
    if(changed||manual)render();
    if(pending.size){clearTimeout(timer);timer=setTimeout(()=>syncNow(false),1500)}}
  catch(e){ids.forEach(id=>pending.add(id));setStatus(navigator.onLine===false?'offline':'local');
    if(manual||e.error==='bad_key'){ui.sheet={busy:null,msg:syncErr(e),err:true,where:where||'settle'};render()}
    if(e.error!=='bad_key')retryT=setTimeout(()=>syncNow(false),30000)}
  syncing=false;return ok}
async function cloudLoad(){if(!syncCfg())return;try{const j=await api({action:'load'});const changed=mergeRemote(j.data);const pc=JSON.stringify(j.profiles||[])!==JSON.stringify(ui.profiles||[]);ui.profiles=j.profiles||[];const rc=JSON.stringify(j.rsvp||{})!==JSON.stringify(ui.rsvp||{});ui.rsvp=j.rsvp||{};if((pc||rc)&&(tab==='games'||tab==='invite'))render();S.settings.bookUrl=j.sheetUrl;lsSave();if(changed)render();if(pending.size)syncNow(false);else setStatus('cloud')}catch(e){setStatus(navigator.onLine===false?'offline':'local')}}
function encodeConn(c){return btoa(unescape(encodeURIComponent(c.url+'|'+c.key))).replace(/=+$/,'')}
function decodeConn(code){try{code=String(code).trim().replace(/^.*#connect=/,'');const t=decodeURIComponent(escape(atob(code)));const [url,key]=t.split('|');if(/^https:\/\/script\.google(usercontent)?\.com\//.test(url)&&key)return{url,key}}catch(e){}return null}
async function connectWith(code,where){const c=decodeConn(code);if(!c){ui.sheet={busy:null,msg:'That does not look like a NamMane connection code. Copy the whole code and try again.',err:true,where};render();return}
  S.settings.sync=c;lsSave();Object.values(S.games).forEach(g=>{if(!g.sample)pending.add(g.id)});ui.sheet={busy:'book',msg:'',err:false,where};render();
  try{const j=await api({action:'load'});mergeRemote(j.data);S.settings.bookUrl=j.sheetUrl;lsSave();ui.sheet={busy:null,msg:'',err:false,where};await syncNow(true,where);ui.sheet.msg='Connected. This device now saves to your Google Sheet and shares games with your other devices.';render()}
  catch(e){delete S.settings.sync;lsSave();ui.sheet={busy:null,msg:syncErr(e),err:true,where};render()}}
function latestId(){const gs=Object.values(S.games).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return gs[0]?gs[0].id:null}

/* ---------- model ---------- */
const G=()=>S.games[S.cur]||null;
function autoName(d){return 'Game · '+dLabel(d)}
function newGame(o){const id='g'+nid();const g={kind:'game',id,name:o.name||autoName(o.date||today()),autoName:!!o.autoName,time:o.time||'',venue:o.venue||'',date:o.date||today(),cur:o.cur||'₹',defBuy:o.defBuy||1000,defM:o.sample?'cash':'credit',noCash:!o.sample,tables:[{id:'t1',name:'Table 1',dealer:'',dealerPid:'',closed:false}],dealer:[],players:[],rake:[],expenses:[],finished:false,createdAt:Date.now(),updatedAt:Date.now(),sample:!!o.sample};S.games[id]=g;S.cur=id;S.deleted=S.deleted.filter(x=>x!==id);return g}
const money=(n,g)=>{g=g||G();const v=r2(Math.abs(n));return (g?g.cur:'₹')+v.toLocaleString('en-IN',{maximumFractionDigits:2})};
const sgn=(n,g)=>(n>0.004?'+':n<-0.004?'−':'')+money(n,g);
const cls=n=>n>0.004?'up':n<-0.004?'down':'mut';
const sumB=p=>p.buyins.reduce((a,b)=>a+b.amt,0);
const credB=p=>p.buyins.filter(b=>b.m==='credit').reduce((a,b)=>a+b.amt,0);
function norm(g){if(!g.tables||!g.tables.length)g.tables=[{id:'t1',name:'Table 1',dealer:'',dealerPid:'',closed:false}];if(!g.dealer)g.dealer=[];const t0=g.tables[0].id;g.players.forEach(p=>{if(!p.table||!g.tables.some(t=>t.id===p.table))p.table=t0});return g}
function dealerName(g,t){if(t.dealerPid){const p=g.players.find(x=>x.id===t.dealerPid);if(p)return p.name}return (t.dealer||'').trim()||t.name+' dealer'}
function tableStats(g,tid){const ps=g.players.filter(p=>p.table===tid);const B=ps.reduce((a,p)=>a+sumB(p),0),C=ps.reduce((a,p)=>a+(p.out||0),0);
  const rk=g.rake.filter(r=>(r.table||g.tables[0].id)===tid).reduce((a,r)=>a+r.amt,0);const dl=g.dealer.filter(d=>d.table===tid);const dbp=dl.filter(d=>d.src!=='rake').reduce((a,d)=>a+d.amt,0),dbr=dl.filter(d=>d.src==='rake').reduce((a,d)=>a+d.amt,0);
  const outN=ps.filter(p=>p.out!=null).length;return{ps,B,C,rk,dbp,dbr,db:dbp+dbr,outN,allOut:ps.length>0&&outN===ps.length,onTable:B-rk-dbp-C}}
function calc(g){norm(g);
  const ps=g.players,n=ps.length;
  const B=ps.reduce((a,p)=>a+sumB(p),0), CR=ps.reduce((a,p)=>a+credB(p),0);
  const R=g.rake.reduce((a,x)=>a+x.amt,0);
  const pExp=g.expenses.filter(e=>e.split==='players').reduce((a,e)=>a+e.amt,0);
  const rExp=g.expenses.filter(e=>e.split==='rake').reduce((a,e)=>a+e.amt,0);
  const bankPaidExp=g.expenses.filter(e=>e.by==='bank').reduce((a,e)=>a+e.amt,0);
  const share=n?pExp/n:0;
  const outs=ps.filter(p=>p.out!=null), C=outs.reduce((a,p)=>a+p.out,0);
  const rows=ps.map(p=>{const b=sumB(p),cr=credB(p),paid=g.expenses.filter(e=>e.by===p.id).reduce((a,e)=>a+e.amt,0),c=p.out;
    const res=c==null?null:c-b;return{p,b,cr,paid,c,res,share,final:res==null?null:res-share,bal:c==null?null:c-cr-share+paid}});
  const allOut=n>0&&outs.length===n;
  const DBp=g.dealer.filter(d=>d.src!=='rake').reduce((a,d)=>a+d.amt,0),DBr=g.dealer.filter(d=>d.src==='rake').reduce((a,d)=>a+d.amt,0),DB=DBp+DBr;
  const onTable=B-R-DBp-C;
  const sumBal=rows.reduce((a,r)=>a+(r.bal||0),0);
  const bankEnd=(B-CR)-sumBal-bankPaidExp-DB;
  return{B,CR,R,pExp,rExp,share,C,rows,allOut,onTable,bankEnd,n,outN:outs.length,house:R-rExp-DBr,DB,DBp,DBr};
}

/* ---------- settle up: fewest payments between players and the host ---------- */
const hostName=g=>(g.hostName||'').trim()||'Host';
function settleNets(g){const c=calc(g);if(!c.n||!c.allOut)return null;const nc=g.noCash!==false;
  const P=c.rows.map(r=>({id:r.p.id,name:r.p.name,phone:r.p.phone||'',net:r2(r.c-(nc?r.b:r.cr)-r.share+r.paid)}));
  const D={};g.dealer.forEach(d=>{const t=g.tables.find(x=>x.id===d.table)||g.tables[0];const dp=t.dealerPid&&P.find(x=>x.id===t.dealerPid);if(dp){dp.net=r2(dp.net+d.amt);return}const nm=dealerName(g,t);const k='dealer:'+nm.toLowerCase();D[k]=D[k]||{id:k,name:nm,phone:'',net:0};D[k].net=r2(D[k].net+d.amt)});
  const DL=Object.values(D);
  const house=r2(-P.reduce((a,x)=>a+x.net,0)-DL.reduce((a,x)=>a+x.net,0));const h=g.holder&&P.find(x=>x.id===g.holder);
  if(h)h.net=r2(h.net+house);else if(Math.abs(house)>=0.005)P.push({id:'house',name:hostName(g),phone:'',net:house});
  return P.concat(DL)}
function minTransfers(P){const cr=P.filter(x=>x.net>0.004).map(x=>({id:x.id,v:x.net})).sort((a,b)=>b.v-a.v),db=P.filter(x=>x.net<-0.004).map(x=>({id:x.id,v:-x.net})).sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;while(i<db.length&&j<cr.length){const a=Math.min(db[i].v,cr[j].v);if(a>=0.005)out.push({from:db[i].id,to:cr[j].id,amt:r2(a),done:false});db[i].v-=a;cr[j].v-=a;if(db[i].v<0.005)i++;if(cr[j].v<0.005)j++}return out}
const netSig=P=>JSON.stringify(P.map(x=>[x.id,x.net]));
function pName(g,id){if(String(id).startsWith('dealer:')){const t=(g.tables||[]).find(x=>dealerName(g,x).toLowerCase()===id.slice(7));return t?dealerName(g,t):id.slice(7)}return id==='house'?hostName(g):(g.players.find(p=>p.id===id)||{}).name||'Removed player'}
function pPhone(g,id){return id==='house'?'':(g.players.find(p=>p.id===id)||{}).phone||''}
function doSettle(g){const P=settleNets(g);if(!P)return;const old=(g.settle&&g.settle.list)||[];const list=minTransfers(P).map(t=>{const o=old.find(x=>x.done&&x.from===t.from&&x.to===t.to&&Math.abs(x.amt-t.amt)<0.005);return o?Object.assign(t,{done:true,doneAt:o.doneAt}):t});g.settle={at:Date.now(),sig:netSig(P),list}}
function liveTransfers(g){if(g.settle)return g.settle.list;const P=settleNets(g);return P?minTransfers(P):[]}
function settleState(g){const c=calc(g);if(!c.n)return{k:'empty',t:'No players'};if(!c.allOut)return{k:'play',t:'In progress'};if(!g.settle)return{k:'ready',t:'Ready to settle up'};
  const due=g.settle.list.filter(x=>!x.done);if(!due.length)return{k:'done',t:'All settled'};return{k:'due',t:money(due.reduce((a,x)=>a+x.amt,0),g)+' to settle',amt:due.reduce((a,x)=>a+x.amt,0)}}
function personStatus(g,id){if(!g.settle)return '';const mine=g.settle.list.filter(x=>x.from===id||x.to===id);if(!mine.length)return '<span class="tag out">Square</span>';
  const open=mine.filter(x=>!x.done);if(!open.length)return '<span class="tag live">Settled ✓</span>';
  const pay=open.filter(x=>x.from===id).reduce((a,x)=>a+x.amt,0),get=open.filter(x=>x.to===id).reduce((a,x)=>a+x.amt,0);
  return pay?`<span class="tag due">Pays ${money(pay,g)}</span>`:`<span class="tag due">Gets ${money(get,g)}</span>`}
function chipCheck(g,c){const missing=g.players.filter(p=>p.out==null);const diff=c.allOut?c.C-(c.B-c.R-c.DBp):null;
  if(!c.n)return `<div class="callout warn">Add players on the Table tab first.</div>`;
  if(!c.allOut)return `<div class="callout warn">Still playing: <b>${missing.map(p=>esc(p.name)).join(', ')}</b>. Enter their cash-out on the Table tab to settle up. Chips that should still be on the table: <b class="k">${money(c.onTable,g)}</b>.</div>`;
  if(Math.abs(diff)<0.01)return `<div class="callout ok">Chips balance. Buy-ins ${money(c.B,g)} minus rake ${money(c.R,g)}${c.DBp?` and dealer tips ${money(c.DBp,g)}`:''} equals cash-outs ${money(c.C,g)}.</div>`;
  return `<div class="callout warn">Chip count is ${diff>0?'over':'short'} by <b class="k">${money(diff,g)}</b>. Expected cash-outs ${money(c.B-c.R-c.DBp,g)}, counted ${money(c.C,g)}. Recount or check for a missed buy-in or rake entry before settling up; otherwise the ${esc(hostName(g))} absorbs the difference.</div>`}
function resultsTable(g,c){const rows=c.rows;const st=!!g.settle;return `<div class="tscroll"><table class="t">

function remindText(g,t){return `♠ NamMane · ${g.name}\nHi ${pName(g,t.from)}, please pay ${money(t.amt,g)} to ${pName(g,t.to)} to settle up. Thanks!`}
function settleSection(g,c){const id=g.id,nc=g.noCash!==false;const P=c.allOut?settleNets(g):null;const stale=g.settle&&P&&netSig(P)!==g.settle.sig;

    <div class="list">${L.map((t,i)=>`<div class="li xfer ${t.done?'isdone':''}"><div class="main"><div class="pay"><b>${esc(pName(g,t.from))}</b> pays <b>${esc(pName(g,t.to))}</b></div><div class="sub">${t.done?`Settled ${t.doneAt?when(t.doneAt):''}`:'Not settled yet'}</div></div>
      <span class="num pay amtx">${money(t.amt,g)}</span>

function gameTab(g){const c=calc(g);const pn=id=>id==='bank'?'Bank':(g.players.find(p=>p.id===id)||{}).name||'Removed player';const t=x=>x?when(x):'';
  const R=[['NamMane',g.name],['Date',dLabel(g.date)],['Day',new Date(g.date+'T12:00').toLocaleDateString('en-IN',{weekday:'long'})],['Start time',g.time||''],['Venue',g.venue||''],['Address',g.address||''],['Google Maps',mapsLink(g)],['Gate pass',g.gatePass||''],['Note',g.notes||''],['Standard buy-in',g.defBuy],['Currency',g.cur],['Status',g.finished?'Finished':c.allOut&&c.n?'All cashed out':'In progress'],[]];
  R.push(['TOTALS'],['Total buy-ins',r2(c.B)],['Bought in on credit',r2(c.CR)],['Rake collected',r2(c.R)],['Shared expenses',r2(c.pExp)],['Expenses paid from rake',r2(c.rExp)],['Dealer bonus (tips from pots)',r2(c.DBp)],['Dealer bonus (paid from rake)',r2(c.DBr)],['House keeps',r2(c.house)],['Chip check difference',c.allOut?r2(c.C-(c.B-c.R-c.DBp)):'Players still at the table'],[]);
  R.push(['TABLES'],['Table','Dealer','Players','Buy-ins','Cash-outs','Rake','Dealer bonus','Status']);g.tables.forEach(tb=>{const st=tableStats(g,tb.id);R.push([tb.name,dealerName(g,tb),st.ps.length,r2(st.B),r2(st.C),r2(st.rk),r2(st.db),tb.closed?'Closed '+(tb.closedAt?when(tb.closedAt):''):'Open'])});R.push([]);
  R.push(['PLAYERS'],['Player','Phone','Buy-ins','Bought in','On credit','Cash-out','Poker result','Expense share','Paid expenses','Net for the night','Payout','Who pays']);
  c.rows.forEach(r=>R.push([r.p.name,r.p.phone||'',r.p.buyins.length,r2(r.b),r2(r.cr),r.c==null?'':r2(r.c),r.res==null?'':r2(r.res),r2(r.share),r2(r.paid),r.final==null?'':r2(r.final),r.bal==null?'':r2(Math.abs(r.bal)),r.bal==null?'Still playing':Math.abs(r.bal)<0.005?'Square':r.bal>0?'Bank pays player':'Player pays bank']));
  const T=liveTransfers(g);R.push([],['SETTLE UP'],['From','To','Amount','Status']);T.forEach(t=>R.push([pName(g,t.from),pName(g,t.to),t.amt,t.done?'Settled'+(t.doneAt?' '+when(t.doneAt):''):(g.settle?'Not settled':'Not settled up yet')]));
  R.push([],['BUY-INS'],['Time','Player','Amount','Paid by']);g.players.forEach(p=>p.buyins.forEach(b=>R.push([t(b.t),p.name,b.amt,mlab(b.m)])));
  R.push([],['CASH-OUTS'],['Time','Player','Amount']);g.players.forEach(p=>{if(p.out!=null)R.push([t(p.outT),p.name,p.out])});
  R.push([],['RAKE'],['Time','Note','Amount']);g.rake.forEach(r=>R.push([t(r.t),r.note||'Rake',r.amt]));
  R.push([],['DEALER BONUS'],['Time','Table','Dealer','Amount','Source']);g.dealer.forEach(d=>{const tb=g.tables.find(x=>x.id===d.table)||g.tables[0];R.push([t(d.t),tb.name,dealerName(g,tb),d.amt,d.src==='rake'?'Paid from rake':'Tips from pots'])});
  R.push([],['EXPENSES'],['Time','Item','Amount','Paid by','Covered by']);g.expenses.forEach(e=>R.push([t(e.t),e.label,e.amt,pn(e.by),e.split==='rake'?'Rake':'Players equally']));
  return R}
function tabName(g,used){const d=dLabel(g.date);const extra=g.name===autoName(g.date)?'':' '+g.name;let b=(d+extra).replace(/[\[\]:*?\/\\]/g,' ').replace(/\s+/g,' ').trim().slice(0,28)||'Game';let n=b,i=2;while(used.has(n.toLowerCase()))n=b.slice(0,25)+' '+(i++);used.add(n.toLowerCase());return n}
function sheetPayload(){const gs=realGames();const used=new Set(['summary','all players','rake & expenses']);const names=gs.map(g=>tabName(g,used));
  const sum=[['Date','Day','Game','Venue','Tables','Players','Total buy-ins','Rake','Dealer bonus','Shared expenses','House keeps','Status','Tab']];
  gs.forEach((g,i)=>{const c=calc(g);sum.push([dLabel(g.date),new Date(g.date+'T12:00').toLocaleDateString('en-IN',{weekday:'short'}),g.name,g.venue||'',g.tables.length,c.n,r2(c.B),r2(c.R),r2(c.DB),r2(c.pExp),r2(c.house),g.finished?'Finished':'In progress',names[i]])});
  const all=[['Date','Game','Table','Player','Phone','Bought in','On credit','Cash-out','Poker result','Expense share','Net for the night']];
  gs.forEach(g=>calc(g).rows.forEach(r=>all.push([dLabel(g.date),g.name,(g.tables.find(x=>x.id===r.p.table)||{}).name||'',r.p.name,r.p.phone||'',r2(r.b),r2(r.cr),r.c==null?'':r2(r.c),r.res==null?'':r2(r.res),r2(r.share),r.final==null?'':r2(r.final)])));
  const ex=[['Date','Game','Type','Item','Amount','Paid by','Covered by']];
  gs.forEach(g=>{const pn=id=>id==='bank'?'Bank':(g.players.find(p=>p.id===id)||{}).name||'Removed player';g.rake.forEach(r=>ex.push([dLabel(g.date),g.name,'Rake',r.note||'Rake',r.amt,'','House']));norm(g);g.dealer.forEach(d=>{const tb=g.tables.find(x=>x.id===d.table)||g.tables[0];ex.push([dLabel(g.date),g.name,'Dealer bonus',tb.name+' · '+dealerName(g,tb),d.amt,d.src==='rake'?'House':'Pots',d.src==='rake'?'Rake':'Tips from pots'])});g.expenses.forEach(e=>ex.push([dLabel(g.date),g.name,'Expense',e.label,e.amt,pn(e.by),e.split==='rake'?'Rake':'Players equally']))});
  const tabs=[{key:'summary',name:'Summary',header:true,rows:sum},{key:'players',name:'All players',header:true,rows:all},{key:'costs',name:'Rake & expenses',header:true,rows:ex}];
  gs.slice().reverse().forEach(g=>{const i=gs.indexOf(g);tabs.push({key:g.id,name:names[i],rows:gameTab(g)})});
  return{tabs}}
function summary(g,c){const L=[];L.push(`♠ NamMane — ${g.name}`);L.push(whenTxt(g)+(g.venue?` · ${g.venue}`:''));L.push(`Buy-ins ${money(c.B)} · Rake ${money(c.R)}${c.pExp?` · Shared costs ${money(c.pExp)}`:''}`);L.push('');
  [...c.rows].sort((a,b)=>(b.final??-1e12)-(a.final??-1e12)).forEach(r=>L.push(`${r.p.name}: in ${money(r.b)}, out ${r.c==null?'—':money(r.c)} → ${r.final==null?'still playing':sgn(r.final)}`));
  const T=liveTransfers(g);if(T.length){L.push('');L.push('Settle up:');T.forEach(t=>L.push(`• ${pName(g,t.from)} pays ${pName(g,t.to)} ${money(t.amt,g)}${t.done?' ✅':''}`))}
  return L.join('\n')}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  wake();
  if(t.dataset.tab){tab=t.dataset.tab;ui.confirm=null;render();window.scrollTo(0,0);return}
  const a=t.dataset.act,g=G(),pid=t.dataset.p;
  switch(a){
    case 'sample':sample();tab='table';break;
    case 'seg':
      if(t.dataset.k==='defM'){g.defM=t.dataset.v;touch(g)}
      else if(t.dataset.k==='buyM'){ui.buyM=t.dataset.v;const inp=$('#ba-'+pid);const keep=inp?inp.value:null;render();const i2=$('#ba-'+pid);if(i2&&keep!=null)i2.value=keep;return}
      break;
    case 'quickBuy':snap();addBuy(pid,+t.dataset.v||g.defBuy,g.defM);break;
    case 'openBuy':ui.buy=pid;ui.buyM=g.defM;render();setTimeout(()=>{const i=$('#ba-'+pid);i&&i.focus()},30);return;
    case 'cancelBuy':ui.buy=null;break;
    case 'rmBuy':{snap();const p=g.players.find(x=>x.id===pid);p.buyins=p.buyins.filter(x=>x.id!==t.dataset.b);touch(g);toast('Buy-in removed',true);break}
    case 'editOut':ui.editOut=pid;break;
    case 'cancelOut':ui.editOut=null;break;
    case 'askRmP':ui.confirm='p:'+pid;break;
    case 'askRmG':ui.confirm='g:'+t.dataset.id;break;
    case 'noConfirm':ui.confirm=null;break;
    case 'rmP':{snap();const p=g.players.find(x=>x.id===pid);g.players=g.players.filter(x=>x.id!==pid);g.expenses.forEach(x=>{if(x.by===pid)x.by='bank'});ui.confirm=null;touch(g);toast(`${p?p.name:'Player'} removed`,true);break}
    case 'quickRake':snap();g.rake.push({id:nid(),amt:+t.dataset.v,note:'',table:($('#rkTable')&&$('#rkTable').value)||curTable(g).id,t:Date.now()});touch(g);toast(`Rake ${money(+t.dataset.v)} added`,true);break;
    case 'rmRake':snap();g.rake=g.rake.filter(x=>x.id!==t.dataset.id);touch(g);toast('Rake entry removed',true);break;
    case 'exSplit':ui.exSplit=t.dataset.v;{const f=['exLabel','exAmt','exBy'].map(i=>$('#'+i)?.value);render();['exLabel','exAmt','exBy'].forEach((i,k)=>{if($('#'+i)&&f[k]!=null)$('#'+i).value=f[k]})}return;
    case 'rmExp':snap();g.expenses=g.expenses.filter(x=>x.id!==t.dataset.id);touch(g);toast('Expense removed',true);break;
    case 'previewWa':showInvPreview(waLink('',inviteText(g)),g);return;
    case 'sendOneWa':showInvPreview(waLink(t.dataset.ph,inviteText(g,{name:t.dataset.n})),g,t.dataset.n);return;
    case 'sendAllWa':{const ps=invList(g).filter(x=>x.phone);if(!ps.length){toast('No players with phone numbers',false);return}let i=0;const sendNext=()=>{if(i>=ps.length){toast('All invitations previewed',false);return}const p=ps[i];showInvPreview(waLink(p.phone,inviteText(g,p)),g,p.name);const ov=document.getElementById('invOv');if(ov){const orig=ov.querySelector('[data-act="approveWa"]');if(orig){orig.addEventListener('click',()=>{const o=p.src==='i'?(g.invitees||[]).find(x=>x.id===p.key.split(':')[1]):g.players.find(x=>x.id===p.key.split(':')[1]);if(o){o.invitedAt=Date.now();touch(g)}i++;setTimeout(()=>{const ov2=document.getElementById('invOv');if(ov2)ov2.remove();sendNext()},800)})}}};sendNext();return}
    case 'previewOneWa':{const href=waLink(t.dataset.ph,inviteText(g,{name:t.dataset.n}));showInvPreview(href,g,t.dataset.n);const ov=document.getElementById('invOv');if(ov){const lnk=ov.querySelector('[data-act="approveWa"]');if(lnk)lnk.addEventListener('click',()=>{const k=t.dataset.k;const [src,id]=k.split(':');const o=src==='i'?(g.invitees||[]).find(x=>x.id===id):g.players.find(x=>x.id===id);if(o){o.invitedAt=Date.now();touch(g);setTimeout(render,600)}setTimeout(()=>{const ov2=document.getElementById('invOv');if(ov2)ov2.remove()},400)})}return}
    case 'approveWa':{const ov=document.getElementById('invOv');if(ov)setTimeout(()=>ov.remove(),400);return}
    case 'closePreview':{const ov=document.getElementById('invOv');if(ov)ov.remove();return}
    case 'copyInvite':{const txt=$('#inviteTxt').textContent;try{navigator.clipboard.writeText(txt).then(()=>toast('Invitation copied',false),()=>selectEl('#inviteTxt'))}catch(err){selectEl('#inviteTxt')}return}
    case 'invited':{const k=t.dataset.k||('p:'+pid);const [src,id]=k.split(':');const o=src==='i'?(g.invitees||[]).find(x=>x.id===id):g.players.find(x=>x.id===id);if(o){o.invitedAt=Date.now();touch(g);setTimeout(render,600)}return}
    case 'resetInv':snap();g.players.forEach(p=>{delete p.invitedAt});(g.invitees||[]).forEach(p=>{delete p.invitedAt});touch(g);toast('Invite list reset',true);break;
    case 'invitePerson':{snap();g.invitees=g.invitees||[];g.invitees.push({id:nid(),name:t.dataset.n,phone:t.dataset.ph});touch(g);toast(t.dataset.n+' invited',true);break}
    case 'uninvite':{snap();const id=t.dataset.k.split(':')[1];g.invitees=(g.invitees||[]).filter(x=>x.id!==id);touch(g);toast('Removed from invite',true);break}
    case 'openInvite':S.cur=t.dataset.id;ui.table=null;lsSave();tab='invite';window.scrollTo(0,0);break;
    case 'seatInvitee':case 'seatAll':{const x=S.games[t.dataset.g];if(!x)break;norm(x);const atT=new Set(x.players.map(p=>waNum(p.phone)).filter(Boolean));
      const pick=(x.invitees||[]).filter(v=>rsvpOf(x,v.phone)==='yes'&&!atT.has(waNum(v.phone))&&(a==='seatAll'||('i:'+v.id)===t.dataset.k));
      pick.forEach(v=>x.players.push({id:'p'+nid(),table:x.tables[0].id,name:v.name,phone:v.phone,buyins:[],out:null}));touch(x);toast(pick.length===1?pick[0].name+' added to '+x.tables[0].name:pick.length+' players added to '+x.tables[0].name,false);break}
    case 'addRosterOpen':ui.addingPlayer=true;render();setTimeout(()=>{const i=$('#rpName');i&&i.focus()},30);return;
    case 'cancelAddRoster':ui.addingPlayer=false;break;
    case 'hardResetOpen':ui.reset={};render();setTimeout(()=>{const i=$('#hrPin');i&&i.focus()},30);return;
    case 'hardResetCancel':ui.reset=null;break;
    case 'pickTable':ui.table=t.dataset.t;ui.closing=null;break;
    case 'addTable':{snap();norm(g);const n=g.tables.length+1;const nt={id:'t'+nid(),name:'Table '+n,dealer:'',dealerPid:'',closed:false};g.tables.push(nt);ui.table=nt.id;touch(g);toast(nt.name+' added',true);break}
    case 'rmTable':{snap();g.tables=g.tables.filter(x=>x.id!==t.dataset.t);g.rake.forEach(r=>{if(r.table===t.dataset.t)r.table=g.tables[0].id});ui.table=null;touch(g);toast('Table removed',true);break}
    case 'closeTable':{const tb=g.tables.find(x=>x.id===t.dataset.t);const st=tableStats(g,tb.id);if(st.allOut){snap();tb.closed=true;tb.closedAt=Date.now();touch(g);toast(tb.name+' closed',true)}else ui.closing=tb.id;break}
    case 'cancelClose':ui.closing=null;break;
    case 'reopenTable':{const tb=g.tables.find(x=>x.id===t.dataset.t);tb.closed=false;touch(g);break}
    case 'dbSrc':{ui.dbSrc=t.dataset.v;const keep=[...document.querySelectorAll('input[id^="dba-"]')].map(i=>[i.id,i.value]);render();keep.forEach(([k,v])=>{const i=document.getElementById(k);if(i)i.value=v})}return;
    case 'rmDB':{const x=S.games[t.dataset.g]||g;x.dealer=x.dealer.filter(d=>d.id!==t.dataset.id);touch(x);toast('Dealer bonus removed',false);break}
    case 'settleUp':{const x=S.games[t.dataset.g];if(x){doSettle(x);touch(x);toast(x.settle.list.length?`${x.settle.list.length} payment${x.settle.list.length>1?'s':''} to settle`:'Everyone is square',false)}break}
    case 'tglPaid':{const x=S.games[t.dataset.g];const tr=x&&x.settle&&x.settle.list[+t.dataset.i];if(tr){tr.done=!tr.done;tr.doneAt=tr.done?Date.now():null;touch(x)}break}
    case 'noCash':{const x=S.games[t.dataset.g];if(x){x.noCash=t.dataset.v==='1';touch(x)}break}
    case 'copy':{const txt=$('#shareTxt').textContent;const done=()=>toast('Summary copied',false);
      try{navigator.clipboard.writeText(txt).then(done,()=>selectShare())}catch(err){selectShare()}return}
    case 'finish':g.finished=!g.finished;touch(g);if(g.finished&&syncCfg()){(async()=>{const ok=await syncNow(true,'settle');if(ok){ui.sheet.msg='Game finished and saved to the Google Sheet.';render()}})();return}break;
    case 'saveBook':if(!syncCfg()){ui.sheet={busy:null,msg:'Connect your Google Sheet first.',err:true,where:tab==='games'?'games':'settle'};break}syncNow(true,tab==='games'?'games':'settle');return;
    case 'approveP':{const em=t.dataset.email,okk=t.dataset.ok==='1';(async()=>{try{const j=await api({action:'approve',email:em,ok:okk});ui.profiles=j.profiles||[];toast(okk?'Player approved':'Access removed',false)}catch(e){toast('Could not reach your Google Sheet. Try again.',false)}render()})();return}
    case 'copyConn':{const txt=$('#connTxt').textContent;try{navigator.clipboard.writeText(txt).then(()=>toast('Connection code copied',false),()=>selectEl('#connTxt'))}catch(err){selectEl('#connTxt')}return}
    case 'signOutAdmin':S={games:{},cur:null,deleted:[],settings:{updatedAt:0}};lsSave();pending.clear();setStatus('local');tab='table';ui.login={who:'admin'};$('#hdrOut').hidden=true;window.scrollTo(0,0);break;
    case 'install':window.LPInstall&&window.LPInstall.open();return;
    case 'who':ui.login={who:t.dataset.v};try{localStorage.setItem('lp.who',t.dataset.v)}catch(e){}break;
    case 'eye':{const i=document.getElementById(t.dataset.for);if(i){const sh=i.type==='password';i.type=sh?'text':'password';t.textContent=sh?'Hide':'Show'}return}
    case 'disconnect':delete S.settings.sync;lsSave();setStatus('local');toast('This device is no longer saving to the Google Sheet',false);break;
    case 'openG':S.cur=t.dataset.id;ui.table=null;ui.closing=null;lsSave();tab='table';break;
    case 'rmG':{const id=t.dataset.id;delete S.games[id];if(!S.deleted.includes(id))S.deleted.push(id);pending.add(id);if(S.cur===id)S.cur=latestId();ui.confirm=null;touch(null);if(dbReady){setStatus('saving');clearTimeout(timer);timer=setTimeout(flush,300)}break}
  }
  render();
});
function selectEl(sel){const el=$(sel);const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected — tap Copy',false)}
function selectShare(){const el=$('#shareTxt');const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Text selected — tap Copy',false)}

document.addEventListener('lp-install-ready',()=>render());
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.inv){ui.openInv=ui.openInv||{};ui.openInv[d.dataset.inv]=d.open;return}if(d&&d.classList&&d.classList.contains('gset')){ui.openSet=ui.openSet||{};ui.openSet[d.dataset.id]=d.open}},true);
document.addEventListener('change',e=>{const t=e.target,g=G();
  if(t.dataset&&t.dataset.f==='tname'&&g){const tb=g.tables.find(x=>x.id===t.dataset.t);const v=t.value.trim();if(tb&&v){tb.name=v;touch(g)}render();return}
  if(t.dataset&&t.dataset.f==='tdealer'&&g){const tb=g.tables.find(x=>x.id===t.dataset.t);if(tb){tb.dealerPid=t.value;touch(g);render()}return}
  if(t.dataset&&t.dataset.f==='tdealerName'&&g){const tb=g.tables.find(x=>x.id===t.dataset.t);if(tb){tb.dealer=t.value.trim();touch(g);render()}return}
  if(t.dataset&&t.dataset.f==='ptable'&&g){const p=g.players.find(x=>x.id===t.dataset.p);if(p){p.table=t.value;touch(g);toast(p.name+' moved to '+(g.tables.find(x=>x.id===t.value)||{}).name,false);render()}return}
  if(t.dataset&&t.dataset.f==='holder'){const x=S.games[t.dataset.g];if(x){x.holder=t.value||'';touch(x);render()}return}
  if(t.dataset&&t.dataset.f==='hostName'){const x=S.games[t.dataset.g];if(x){x.hostName=t.value.trim();touch(x);render()}return}
  if(!g)return;
  if(t.id==='pName'&&!$('#pPhone').value){const ph=knownPhone(t.value);if(ph)$('#pPhone').value=ph;return}
  if(t.dataset.f==='pphone'){const p=g.players.find(x=>x.id===t.dataset.p);if(p&&t.value.trim()!==(p.phone||'')){p.phone=t.value.trim();touch(g);render()}return}
  if(t.id==='gDate'&&t.value){const wasAuto=g.autoName||g.name===autoName(g.date);g.date=t.value;if(wasAuto){g.name=autoName(g.date);g.autoName=true}touch(g);render();return}
  if(t.id==='gTime'){g.time=t.value;touch(g);render();return}
  if(t.id==='gVenue'){g.venue=t.value.trim();touch(g);render();return}
  if(t.id==='iAddr'){g.address=t.value.trim();touch(g);render();return}
  if(t.id==='iMaps'){g.mapsUrl=fixUrl(t.value);touch(g);render();return}
  if(t.id==='iGate'){g.gatePass=fixUrl(t.value);touch(g);render();return}
  if(t.id==='iNotes'){g.notes=t.value.trim();touch(g);render();return}
  if(t.id==='gNameIn'){const v=t.value.trim();if(v){g.name=v;g.autoName=v===autoName(g.date);touch(g);render()}else t.value=g.name;return}
  if(t.dataset.f==='pname'){const p=g.players.find(x=>x.id===t.dataset.p);const v=t.value.trim();if(p&&v&&v!==p.name){p.name=v;touch(g)}else t.value=p?p.name:'';return}
  if(t.id==='defBuy'){const v=num(t.value);if(v>0){g.defBuy=v;touch(g);render()}else t.value=g.defBuy}
  if(t.id==='pInitAmt'){ui.addAmt=+t.value;return}
  if(t.id==='buyOpts'){const v=t.value.split(/[,·\s]+/).map(x=>num(x)).filter(x=>x>0);if(v.length){g.buyOpts=[...new Set(v)].slice(0,5);g.defBuy=g.buyOpts[0];touch(g)}render();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='ngName')t.dataset.dirty='1';if(t.id==='ngDate'&&t.value){const n=$('#ngName');if(n&&!n.dataset.dirty)n.value=autoName(t.value)}});
document.addEventListener('submit',e=>{e.preventDefault();wake();const f=e.target,g=G();
  if(f.id==='rosterAdd'){const n=$('#rpName').value.trim(),ph=$('#rpPhone').value.trim();if(!n){toast('Enter a name',false);return}
    /* check if player already exists across all games */
    const existing=allPlayers();const nk=ph?waNum(ph):n.toLowerCase();if(existing.some(p=>(p.phone&&waNum(p.phone)===nk)||(!ph&&p.name.trim().toLowerCase()===n.toLowerCase()))){toast(n+' is already in your players',false);return}
    /* add to the most recent game's invitee list so they persist */
    const rg=Object.values(S.games).filter(x=>!x.sample).sort((a,b)=>b.createdAt-a.createdAt);const tg=rg[0]||G();
    if(tg){snap();tg.invitees=tg.invitees||[];tg.invitees.push({id:nid(),name:n,phone:ph});touch(tg)}
    ui.addingPlayer=false;render();toast(n+' added to players',true);return}
  if(f.id==='hardReset'){doHardReset($('#hrPin').value.trim());return}
  if(f.id==='invAdd'){const n=$('#iaName').value.trim(),ph=$('#iaPhone').value.trim();if(!n){toast('Enter a name',false);return}snap();g.invitees=g.invitees||[];g.invitees.push({id:nid(),name:n,phone:ph});touch(g);render();toast(n+' invited',true);return}
  if(f.id==='emailInvForm'){const eName=$('#eiName').value.trim(),eAddr=$('#eiAddr').value.trim();if(!eAddr){toast('Enter an email address',false);return}
    const st=$('#emailStatus');st.innerHTML='<span style="color:var(--warn)">Sending…</span>';
    (async()=>{try{const r=await api({action:'sendInvite',to:eAddr,playerName:eName||'Friend',gameName:g.name,date:g.date?new Date(g.date+'T12:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'',time:g.time?(()=>{const[h,m]=g.time.split(':');const d=new Date();d.setHours(+h,+m);return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})})():'',venue:g.venue||'',mapUrl:mapsLink(g)||'',gatePass:g.gatePass||'',hostName:ui.adminUser||'Your host'});
      if(r.emailResult&&r.emailResult.sent){st.innerHTML='<span style="color:var(--up)">✓ Sent to '+esc(eAddr)+'</span>';$('#eiAddr').value='';$('#eiName').value='';toast('Invitation emailed to '+eAddr,true)}
      else{st.innerHTML='<span style="color:var(--down)">✗ '+(r.emailResult?esc(r.emailResult.error):'Unknown error')+'</span>';toast('Failed to send email',false)}
    }catch(e){st.innerHTML='<span style="color:var(--down)">✗ '+esc(e.message||'Network error')+'</span>';toast('Failed to send email',false)}})();return}
  if(f.id==='playerLogin'){playerLogin($('#plEmail').value.trim().toLowerCase(),$('#plPass').value);return}
  if(f.id==='adminLogin'){adminLogin($('#alUser').value.trim(),$('#alPass').value);return}
  if(f.id==='setAdmin'){const u=$('#saUser').value.trim(),pw=$('#saPass').value;if(pw.length<8){toast('Use at least 8 characters for the password',false);return}
    (async()=>{try{await api({action:'setAdmin',user:u,pass:pw});$('#saPass').value='';toast('Admin sign-in saved',false)}catch(e){toast('Could not save. Check your connection and try again.',false)}})();return}
  if(f.dataset.form==='connect'){const w=f.dataset.w;connectWith($('#connCode-'+w).value,w);return}
  if(f.id==='ngForm'){const v=num($('#ngBuy').value),dt=$('#ngDate').value||today(),nm=$('#ngName').value.trim();newGame({name:nm||autoName(dt),autoName:!nm||nm===autoName(dt),time:$('#ngTime').value,venue:$('#ngVenue').value.trim(),date:dt,defBuy:v>0?v:1000,cur:$('#ngCur').value.trim()||'₹'});const ng=G();const prev=Object.values(S.games).filter(x=>x.id!==ng.id&&!x.sample&&(x.address||x.mapsUrl||x.gatePass)).sort((a,b)=>b.createdAt-a.createdAt);const src=prev.find(x=>ng.venue&&x.venue&&x.venue.toLowerCase()===ng.venue.toLowerCase())||(!ng.venue?prev[0]:null);
    if(src){if(!ng.venue)ng.venue=src.venue||'';ng.address=src.address||'';ng.mapsUrl=src.mapsUrl||'';ng.gatePass=src.gatePass||'';ng.notes=src.notes||''}
    touch(ng);tab=dt>today()?'invite':'table';render();if(tab==='table')setTimeout(()=>{const i=$('#pName');i&&i.focus()},30);return}
  if(!g)return;
  if(f.id==='addP'){const name=$('#pName').value.trim();if(!name)return;
    if(g.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast(`${name} is already at the table`,false);return}
    snap();const p={id:'p'+nid(),table:curTable(g).id,name,phone:($('#pPhone').value.trim()||knownPhone(name)),buyins:[],out:null};{const fa=+$('#pInitAmt').value;if(fa>0)p.buyins.push({id:nid(),amt:fa,m:g.defM,t:Date.now()})}g.players.push(p);touch(g);render();toast(`${name} added`,true);setTimeout(()=>{const i=$('#pName');i&&i.focus()},30);return}
  if(f.dataset.form==='buy'){const pid=f.dataset.p,v=num($('#ba-'+pid).value);if(!(v>0)){toast('Enter a buy-in amount above zero',false);return}snap();addBuy(pid,v,ui.buyM||g.defM);ui.buy=null;render();return}
  if(f.dataset.form==='db'){const x=S.games[f.dataset.g];const tid=f.dataset.t,v=num(document.getElementById('dba-'+f.dataset.g+'-'+tid).value);if(!x)return;if(!(v>0)){toast('Enter a dealer bonus above zero',false);return}norm(x);x.dealer.push({id:nid(),amt:v,table:tid,src:ui.dbSrc||'pot',t:Date.now()});touch(x);render();toast(`Dealer bonus ${money(v,x)} added`,false);return}
  if(f.dataset.form==='closeT'){const tb=g.tables.find(x=>x.id===f.dataset.t);const st=tableStats(g,tb.id);const vals={};
    for(const p of st.ps){const v=num($('#cl-'+p.id).value);if(!(v>=0)){toast(`Enter a cash-out for ${p.name} (0 if they busted)`,false);const i=$('#cl-'+p.id);i&&i.focus();return}vals[p.id]=v}
    snap();st.ps.forEach(p=>{if(p.out!==vals[p.id]){p.out=vals[p.id];p.outT=Date.now()}});tb.closed=true;tb.closedAt=Date.now();ui.closing=null;touch(g);render();window.scrollTo(0,0);toast(tb.name+' closed',true);return}
  if(f.dataset.form==='out'){const pid=f.dataset.p,v=num($('#co-'+pid).value);if(!(v>=0)){toast('Enter the chips this player cashed out (0 if they busted)',false);return}snap();const p=g.players.find(x=>x.id===pid);p.out=v;p.outT=Date.now();ui.editOut=null;touch(g);render();toast(`${p.name} cashed out ${money(v)}`,true);return}
  if(f.id==='rakeForm'){const v=num($('#rkAmt').value);if(!(v>0)){toast('Enter a rake amount above zero',false);return}snap();g.rake.push({id:nid(),amt:v,note:$('#rkNote').value.trim(),table:($('#rkTable')&&$('#rkTable').value)||curTable(g).id,t:Date.now()});touch(g);render();toast(`Rake ${money(v)} added`,true);return}
  if(f.id==='expForm'){const v=num($('#exAmt').value),l=$('#exLabel').value.trim();if(!(v>0)||!l){toast('Add what the expense was for and its amount',false);return}snap();g.expenses.push({id:nid(),label:l,amt:v,by:$('#exBy').value,split:ui.exSplit||'players',t:Date.now()});touch(g);render();toast(`${l} added`,true);return}
});

/* keep the screen awake during a game */
let lock=null;async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock=null});

function sample(){const g=newGame({name:'Sample game',defBuy:2000,sample:true});g.tables=[{id:'t1',name:'Table 1',dealer:'Ravi (example)',dealerPid:'',closed:false},{id:'t2',name:'Table 2',dealer:'',dealerPid:'',closed:false}];const t0=Date.now()-3*3600e3;
  const mk=(name,buys,out)=>({id:'p'+nid(),name,buyins:buys.map((b,i)=>({id:nid(),amt:b[0],m:b[1],t:t0+i*2400e3+Math.random()*600e3})),out,outT:out==null?null:Date.now()-600e3});
  g.players=[mk('Arjun (example)',[[2000,'cash'],[2000,'cash']],6900),mk('Kabir (example)',[[2000,'upi']],0),mk('Meera (example)',[[2000,'cash']],3600),mk('Rohan (example)',[[2000,'credit'],[1000,'credit']],1100),mk('Zoya (example)',[[2000,'cash']],null)];
  g.rake=[{id:nid(),amt:200,note:'Hand 9',t:t0+3600e3},{id:nid(),amt:200,note:'Hand 21',t:t0+7200e3}];
  g.expenses=[{id:nid(),label:'Dinner',amt:1500,by:g.players[2].id,split:'players',t:t0},{id:nid(),label:'New deck of cards',amt:400,by:'bank',split:'rake',t:t0}];
  touch(g)}

/* ---------- boot ---------- */
$('#brand').innerHTML=fanArt('m',false,'mark')+ribbonWord('r');
lsLoad();if(!S.cur||!S.games[S.cur])S.cur=latestId();
setStatus(lsOk?'local':'unsaved');render();
if(/#connect=/.test(location.hash)){const code=location.hash;history.replaceState(null,'',location.pathname);tab='games';render();connectWith(code,'games')}else cloudLoad();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')cloudLoad();else if(pending.size&&syncCfg())syncNow(false)});
window.addEventListener('online',()=>{if(pending.size)syncNow(false)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
